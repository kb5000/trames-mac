[workspace]
resolver = "2"
members = [
    "crates/trames-hvf",
    "crates/trames-mac",
]
exclude = ["runtime"]

[workspace.dependencies]
trames-vulkan = { path = "runtime/crates/trames-vulkan" }
trames-accel = { path = "runtime/crates/trames-accel" }
trames-native = { path = "runtime/crates/trames-native" }
trames-session = { path = "runtime/crates/trames-session" }
trames-engine = { path = "runtime/crates/trames-engine" }
trames-execution = { path = "runtime/crates/trames-execution" }
trames-kernel = { path = "runtime/crates/trames-kernel" }
trames-memory = { path = "runtime/crates/trames-memory" }
trames-elf = { path = "runtime/crates/trames-elf" }
trames-linux = { path = "runtime/crates/trames-linux" }
trames-vfs = { path = "runtime/crates/trames-vfs" }
trames-net = { path = "runtime/crates/trames-net" }
trames-distro = { path = "runtime/crates/trames-distro" }
trames-bridge = { path = "runtime/crates/trames-bridge" }
trames-shared = { path = "runtime/crates/trames-shared" }
trames-wayland = { path = "runtime/crates/trames-wayland" }

[workspace.package]
version = "1.3.0"
edition = "2021"
rust-version = "1.101"
license = "GPL-3.0-or-later"
repository = "https://github.com/kb5000/trames-mac"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Preserve established iterator/branch forms during the pinned nightly migration.
# These advisory source-style lints do not diagnose correctness problems.
[workspace.lints.clippy]
chunks_exact_to_as_chunks = "allow"
needless_late_init = "allow"
manual_checked_ops = "allow"

[profile.release]
overflow-checks = true
lto = "thin"

[patch.crates-io]
wayland-backend = { path = "runtime/vendor/wayland-backend" }
