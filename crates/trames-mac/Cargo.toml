[package]
name = "trames-mac"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "trames-mac-run"
path = "src/main.rs"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
trames-session = { workspace = true }
trames-wayland = { workspace = true }
trames-shared = { workspace = true }
libc = "=0.2.190"
trames-execution = { workspace = true }
trames-hvf = { path = "../trames-hvf" }
trames-linux = { workspace = true }
trames-memory = { workspace = true }
trames-elf = { workspace = true }
trames-vfs = { workspace = true, features = ["hostfs"] }
trames-distro = { workspace = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tar = { version = "=0.4.46", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

[build-dependencies]
cc = "=1.8.0"

[lints]
workspace = true
