name: Mac
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: rustup show
      - run: python3 scripts/check-execution-boundaries.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: bash -n scripts/build-mac.sh scripts/install-mac.sh
      - run: python3 -m py_compile scripts/package-mac.py tests/integration/mac-environments.py
      - run: bash scripts/build-mac.sh
      - run: python3 scripts/package-mac.py --development
      - uses: actions/upload-artifact@v4
        with:
          name: trames-mac-development
          path: target/dist/*
          if-no-files-found: error
